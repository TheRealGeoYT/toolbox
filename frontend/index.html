<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolBox Dashboard</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --sidebar-bg: #111827;
      --accent: #5865f2;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }

    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background-color: var(--sidebar-bg); border-bottom: 1px solid #334155; }
    .brand { font-size: 1.4rem; font-weight: bold; color: var(--accent); display: flex; align-items: center; gap: 12px; }
    .brand-logo { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #1e293b; }

    .user-profile-top { display: flex; align-items: center; gap: 15px; }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    .verified-icon { color: #38bdf8; }

    .app-container { display: flex; flex: 1; }
    .sidebar { width: 280px; background-color: var(--sidebar-bg); border-right: 1px solid #334155; display: flex; flex-direction: column; padding: 20px; position: relative; }
    
    .server-dropdown-container { position: relative; margin-bottom: 25px; }
    .server-selector-btn { width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; text-align: left; color: white; }
    .server-info-flex { display: flex; align-items: center; gap: 12px; }
    .server-avatar { width: 40px; height: 40px; border-radius: 50%; background: #334155; display: flex; align-items: center; justify-content: center; font-weight: bold; overflow: hidden; flex-shrink: 0; }
    .server-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .server-info h4 { font-size: 0.95rem; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; max-width: 140px; }
    .server-info span { font-size: 0.75rem; color: #10b981; }

    .server-dropdown-menu { position: absolute; top: 100%; left: 0; right: 0; background: #1e293b; border: 1px solid #334155; border-radius: 10px; margin-top: 5px; max-height: 250px; overflow-y: auto; z-index: 100; display: none; }
    .server-dropdown-menu.show { display: block; }
    .dropdown-item { padding: 10px 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; border-bottom: 1px solid #334155; }
    .dropdown-item:hover { background: var(--accent); }

    .nav-menu { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .nav-item button { width: 100%; background: transparent; border: none; color: var(--subtext); padding: 12px 15px; border-radius: 8px; text-align: left; cursor: pointer; font-size: 1rem; display: flex; align-items: center; gap: 10px; }
    .nav-item button:hover, .nav-item button.active { background: var(--accent); color: white; }

    .main-content { flex: 1; padding: 30px; overflow-y: auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 25px; border: 1px solid #334155; margin-bottom: 20px; }
    .card h3 { margin-bottom: 15px; font-size: 1.2rem; }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--subtext); margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: white; font-size: 0.95rem; }
    
    .btn { background: var(--accent); color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-secondary { background: #475569; }
    .btn-danger { background: #ef4444; }
    .hidden { display: none !important; }

    .question-row { display: flex; gap: 10px; margin-bottom: 10px; }
    
    .server-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
    .server-card { background: #0f172a; border: 1px solid #334155; padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; }
    .server-card:hover { border-color: var(--accent); }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <img src="assets/toolbox.png" alt="ToolBox Logo" class="brand-logo" onerror="this.src='https://via.placeholder.com/36?text=TB'">
      <span>ToolBox</span>
    </div>

    <div class="user-profile-top">
      <div id="userInfo" style="display: flex; align-items: center; gap: 8px;">
        <span>Nicht angemeldet</span>
      </div>
      <button id="authBtn" class="btn" onclick="handleAuth()">Login</button>
    </div>
  </header>

  <div class="app-container">
    <aside class="sidebar">
      <div class="server-dropdown-container">
        <button class="server-selector-btn" onclick="toggleServerDropdown()">
          <div class="server-info-flex">
            <div class="server-avatar" id="sidebarServerIcon">?</div>
            <div class="server-info">
              <h4 id="sidebarServerName">Kein Server</h4>
              <span id="sidebarServerStatus">Bitte wählen</span>
            </div>
          </div>
          <span>▼</span>
        </button>

        <div class="server-dropdown-menu" id="serverDropdownMenu">
          <div style="padding: 10px; color: var(--subtext); text-align: center;">Lade Server...</div>
        </div>
      </div>

      <ul class="nav-menu">
        <li class="nav-item"><button id="btnNavServers" class="active" onclick="switchTab('servers')">🌐 Server Auswählen</button></li>
        <li class="nav-item"><button id="btnNavTickets" onclick="switchTab('tickets')">🎫 Tickets Modul</button></li>
      </ul>
    </aside>

    <main class="main-content">
      
      <section id="tab-servers">
        <div class="header"><h2>Wähle deinen Server aus</h2></div>
        <div class="server-grid" id="serverList">Lade Server...</div>
      </section>

      <section id="tab-tickets" class="hidden">
        <div class="header"><h2>🎫 Multi-Panel Ticket Konfigurator</h2></div>

        <div class="card">
          <h3>1. Vorlage wählen</h3>
          <div class="form-group">
            <select id="ticketTemplate" onchange="applyTemplate()">
              <option value="default">-- Eigene Einstellungen --</option>
              <option value="support">🛠️ Allgemeine Support-Anfrage</option>
              <option value="apply">📝 Team-Bewerbung</option>
              <option value="bug">🐛 Fehler / Bug-Report</option>
            </select>
          </div>
        </div>

        <div class="card">
          <h3>2. Panel Details</h3>
          <div class="form-group">
            <label>Ziel-Textkanal</label>
            <select id="ticketChannelSelect"><option>Lade Kanäle...</option></select>
          </div>

          <div class="form-group">
            <label>Panel Titel</label>
            <input type="text" id="panelTitle" value="Support-Tickets">
          </div>

          <div class="form-group">
            <label>Beschreibung</label>
            <textarea id="panelDesc" rows="3">Klicke unten auf den Button, um ein Ticket zu öffnen.</textarea>
          </div>

          <div class="form-group">
            <label>Button Beschriftung</label>
            <input type="text" id="buttonLabel" value="Ticket erstellen">
          </div>
        </div>

        <div class="card">
          <h3>3. Fragen für den Ersteller (Modal Formular)</h3>
          <p style="color: var(--subtext); font-size: 0.85rem; margin-bottom: 15px;">
            Füge Fragen hinzu, die der Benutzer beim Klicken auf den Button im Discord-Formular ausfüllen muss.
          </p>

          <div id="questionsContainer">
            <!-- Dynamische Fragen kommen hierhin -->
          </div>

          <button class="btn btn-secondary" onclick="addQuestionInput()" style="margin-top: 10px;">+ Frage hinzufügen</button>
        </div>

        <button class="btn" onclick="sendTicketPanel()" style="width: 100%; padding: 15px; font-size: 1.1rem;">Panel auf Discord absenden</button>
      </section>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
